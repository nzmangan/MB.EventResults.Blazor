# Root so the workers can read uploaded files whatever permissions they end up with on the mounted folder.
user root;
worker_processes 1;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  keepalive_timeout 30;

  # Only serves the .gz files that already exist, nothing is compressed on the fly.
  gzip_static on;
  gzip_vary on;

  # Browsers keep a copy and revalidate it, so new versions show up straight away.
  add_header Cache-Control "no-cache";

  server {
    listen 8080;
    root /usr/share/nginx/html;

    location /data/ {
      root /;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
